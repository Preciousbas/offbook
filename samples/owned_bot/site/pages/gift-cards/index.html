<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gift Cards — Offbook Demo Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&family=Fraunces:opsz,wght@9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/">Offbook <span>Demo Store</span></a>
        <nav class="nav" aria-label="Primary">
          <a href="/products/trail-runner">Trail Runner</a>
          <a href="/pages/sale">Sale</a>
          <a href="/pages/shipping">Shipping</a>
          <a href="/pages/returns">Returns</a>
          <a href="/pages/faq">FAQ</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <h1>Gift cards</h1>
        <p class="lede">Balances never expire on this demo store.</p>
      </section>

      <article class="panel">
        <h2>Policy</h2>
        <p>Gift cards never expire.</p>
        <p>
          Gift returns follow the
          <a href="/pages/returns">returns policy</a> (packing slip
          accepted).
        </p>
      </article>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p><a href="/">← Back to store</a></p>
      </div>
    </footer>
    <script src="/assets/site.js" defer></script>
  </body>
</html>
